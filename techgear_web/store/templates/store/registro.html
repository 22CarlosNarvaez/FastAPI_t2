{% extends "store/base.html" %}
{% block title %}Registro{% endblock %}
{% block robots %}noindex,nofollow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card auth-card shadow-sm mx-auto"><div class="card-body">
      <p class="eyebrow">Tu cuenta TechGear</p>
      <h1 class="h2 mb-4">Crear cuenta</h1>
      <p class="text-secondary mb-4">Crea tu cuenta para guardar tu carrito y seguir tus pedidos.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label" for="register-name">Nombre</label>
          <input id="register-name" name="nombre" class="form-control" autocomplete="name" required minlength="2"></div>
        <div class="mb-3"><label class="form-label" for="register-email">Correo</label>
          <input id="register-email" type="email" name="email" class="form-control" autocomplete="email" required></div>
        <div class="mb-3"><label class="form-label" for="register-password">Contraseña (de 6 a 72 caracteres)</label>
          <input id="register-password" type="password" name="password" class="form-control" autocomplete="new-password" required minlength="6" maxlength="72"></div>
        <div class="mb-3"><label class="form-label" for="rol">Tipo de usuario</label>
          <select name="rol" id="rol" class="form-select">
            <option value="cliente">Cliente</option>
            <option value="admin">Administrador</option>
          </select></div>
        <div class="mb-3 d-none" id="codigoBox"><label class="form-label" for="admin-code">Código de administrador</label>
          <input id="admin-code" name="codigo_admin" class="form-control" autocomplete="off"></div>
        <button class="btn btn-dark w-100" type="submit">Crear cuenta</button>
      </form>
    </div></div>
  </div>
</div>
<script>
  document.getElementById("rol").addEventListener("change", e =>
    document.getElementById("codigoBox").classList.toggle("d-none", e.target.value !== "admin"));
</script>
{% endblock %}
